name: iOS build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run iOS core tests
        run: swift test --package-path ios/NIKNOLIGCore
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/NIKNOLIG.xcodeproj \
            -scheme NIKNOLIG \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NIKNOLIG-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
