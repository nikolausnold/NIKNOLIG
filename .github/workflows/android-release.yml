name: Android release bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Set release version
        run: |
          set -euo pipefail
          version_name="${GITHUB_REF_NAME#v}"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v1.0.0)."
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Configure the ANDROID_KEYSTORE_BASE64 repository secret before creating a release tag."
            exit 1
          fi

          keystore="$RUNNER_TEMP/niknolig-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret before creating a release tag."
              exit 1
            fi
          done
          ./gradlew :app:bundleRelease --no-daemon
      - name: Verify signed Android App Bundle
        run: |
          bundle="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$bundle" ]]; then
            echo "::error::Expected Android App Bundle was not created at $bundle"
            exit 1
          fi
          jarsigner -verify "$bundle"
      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: niknolig-release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
