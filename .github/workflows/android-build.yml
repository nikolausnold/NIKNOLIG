name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify debug APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk" ]]; then
            echo "::error::Expected debug APK was not created at $apk"
            exit 1
          fi
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: niknolig-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
