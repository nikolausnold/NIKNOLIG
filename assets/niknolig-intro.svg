<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">NIKNOLIG — NIKOLAUS NOLD</title>
  <desc id="description">Lautlose, zehnsekündige Endlosschleife: Goldene Partikel und Lichtlinien formen einen Energiering um ein gekröntes N, gefolgt vom Schriftzug NIKNOLIG und NIKOLAUS NOLD.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#17140e"/>
      <stop offset="0.58" stop-color="#0c0c0a"/>
      <stop offset="1" stop-color="#070807"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b2"/>
      <stop offset="0.28" stop-color="#ddbd70"/>
      <stop offset="0.62" stop-color="#a77d32"/>
      <stop offset="0.82" stop-color="#f0d58b"/>
      <stop offset="1" stop-color="#9a712d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f169" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#f1d98e" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d6b45f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .particle { fill: #d6b45f; opacity: 0; animation: particles 10s linear infinite; }
    .particle:nth-child(3n) { fill: #c8f169; }
    .particle:nth-child(2n) { animation-delay: -.8s; }
    .particle:nth-child(3n) { animation-delay: -1.4s; }
    .beam { fill: none; stroke: url(#beam); stroke-width: 1.5; stroke-dasharray: 900; stroke-dashoffset: 900; animation: light-lines 10s ease-in-out infinite; }
    .beam-secondary { animation-delay: -.25s; }
    .energy-ring { fill: none; stroke: url(#gold); stroke-width: 1.5; stroke-dasharray: 845; stroke-dashoffset: 845; opacity: 0; animation: ring-form 10s ease-in-out infinite; }
    .ring-inner { fill: none; stroke: #c8f169; stroke-width: 1; stroke-dasharray: 530; stroke-dashoffset: 530; opacity: 0; animation: ring-form 10s ease-in-out infinite; animation-delay: -.15s; }
    .logo-symbol { opacity: 0; transform: translateY(14px) scale(.82); transform-origin: 400px 151px; animation: symbol-form 10s cubic-bezier(.2,.72,.2,1) infinite; }
    .logo-type { opacity: 0; transform: translateY(8px); animation: type-form 10s ease-out infinite; }
    .crown { fill: url(#gold); stroke: #f0d58b; stroke-width: 1; stroke-linejoin: round; }
    .monogram { fill: none; stroke: url(#gold); stroke-width: 13; stroke-linecap: square; stroke-linejoin: bevel; }
    .wordmark { fill: url(#gold); font-family: "Manrope", "Segoe UI", Arial, sans-serif; font-size: 39px; font-weight: 700; letter-spacing: 10px; }
    .owner { fill: #d6b45f; font-family: "DM Sans", "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 6px; }
    .underline { stroke: #c8f169; stroke-width: 1; opacity: .55; }
    @keyframes particles {
      0%, 2% { opacity: 0; transform: translateY(8px); }
      7% { opacity: .8; }
      18% { opacity: .55; transform: translateY(-7px); }
      23%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes light-lines {
      0%, 18% { stroke-dashoffset: 900; opacity: 0; }
      23% { opacity: .8; }
      39% { stroke-dashoffset: 0; opacity: .3; }
      44%, 100% { stroke-dashoffset: -900; opacity: 0; }
    }
    @keyframes ring-form {
      0%, 19% { stroke-dashoffset: 845; opacity: 0; }
      24% { opacity: .8; }
      41% { stroke-dashoffset: 0; opacity: .65; }
      94% { stroke-dashoffset: 0; opacity: .5; }
      99%, 100% { stroke-dashoffset: 845; opacity: 0; }
    }
    @keyframes symbol-form {
      0%, 39% { opacity: 0; transform: translateY(14px) scale(.82); }
      49% { opacity: 1; transform: translateY(-2px) scale(1.04); }
      57%, 94% { opacity: 1; transform: translateY(0) scale(1); }
      99%, 100% { opacity: 0; transform: translateY(-3px) scale(1.02); }
    }
    @keyframes type-form {
      0%, 59% { opacity: 0; transform: translateY(8px); }
      68% { opacity: 1; transform: translateY(0); }
      94% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .particle, .beam, .energy-ring, .ring-inner, .logo-symbol, .logo-type {
        animation: none;
        transform: none;
      }
      .particle, .beam { display: none; }
      .energy-ring { stroke-dashoffset: 0; opacity: .5; }
      .ring-inner { stroke-dashoffset: 0; opacity: .2; }
      .logo-symbol, .logo-type { opacity: 1; }
    }
  </style>
  <rect width="800" height="450" fill="url(#space)"/>
  <g aria-hidden="true">
    <circle class="particle" cx="107" cy="103" r="1.8"/>
    <circle class="particle" cx="188" cy="302" r="1.2"/>
    <circle class="particle" cx="253" cy="144" r="1.4"/>
    <circle class="particle" cx="330" cy="72" r="1"/>
    <circle class="particle" cx="476" cy="91" r="1.6"/>
    <circle class="particle" cx="558" cy="278" r="1.2"/>
    <circle class="particle" cx="655" cy="134" r="1.6"/>
    <circle class="particle" cx="697" cy="322" r="1"/>
    <circle class="particle" cx="129" cy="347" r="1.1"/>
    <circle class="particle" cx="610" cy="84" r="1"/>
    <circle class="particle" cx="349" cy="335" r="1.4"/>
    <circle class="particle" cx="723" cy="179" r="1.3"/>
  </g>
  <g aria-hidden="true">
    <path class="beam" d="M82 229 C194 229 249 204 328 171"/>
    <path class="beam beam-secondary" d="M718 229 C606 229 551 204 472 171"/>
    <circle class="energy-ring" cx="400" cy="151" r="134"/>
    <circle class="ring-inner" cx="400" cy="151" r="111"/>
  </g>
  <g class="logo-symbol">
    <path class="crown" d="M352 91 L363 67 L382 83 L400 56 L418 83 L437 67 L448 91 L440 101 L360 101 Z"/>
    <path class="monogram" d="M348 203 V111 L452 203 V111"/>
  </g>
  <g class="logo-type" text-anchor="middle">
    <text class="wordmark" x="400" y="282">NIKNOLIG</text>
    <line class="underline" x1="316" y1="302" x2="484" y2="302"/>
    <text class="owner" x="400" y="329">NIKOLAUS NOLD</text>
  </g>
</svg>
